<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تفسیر معنوی</title>

<!-- ================== PWA ================== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="تفسیر معنوی">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تفسیر معنوی">
<link rel="apple-touch-icon" href="icon/tm-128.png">
<link rel="icon" type="image/png" sizes="64x64" href="icon/tm-64.png">
<link rel="icon" type="image/png" sizes="128x128" href="icon/tm-128.png">
<link rel="icon" type="image/png" sizes="256x256" href="icon/tm-256.png">

<link rel="stylesheet" href="./bootstrap.rtl.min.css">

<script>
/* اعمال سریع تنظیمات قبل از رندر برای جلوگیری از پرش رنگ */
(function() {
  try {
    const s = JSON.parse(localStorage.getItem('manavi_settings_v1') || 'null');
    if (s) {
      if (s.theme && s.theme !== 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      if (s.scale) document.documentElement.style.setProperty('--reading-scale', s.scale);
    }
  } catch {}
})();
</script>

<style>
@font-face {
  font-family: 'Shabnam';
  src: url('./shabnam-500.woff2') format('woff2');
  font-weight: 500;
  font-display: swap;
}

/* ============================================================
   تم پیش‌فرض: شبانه (Dark)
   ============================================================ */
:root {
  --bg: #0f1115;
  --bg-2: #171a21;
  --bg-3: #1f232c;
  --fg: #e6e8ec;
  --fg-muted: #8b93a3;
  --accent: #5fa8ff;
  --accent-2: #6ee7a7;
  --border: #262b36;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
  --topbar-h: 56px;
  --sidebar-w: 290px;
  --reading-scale: 1;
  --overlay-bg: rgba(0,0,0,.6);
}

/* ============================================================
   تم‌ها
   ============================================================ */

/* روشن */
[data-theme="light"] {
  --bg: #f4f6fa;
  --bg-2: #ffffff;
  --bg-3: #eef1f6;
  --fg: #1a1f2a;
  --fg-muted: #6b7280;
  --accent: #2563eb;
  --accent-2: #059669;
  --border: #e2e6ed;
  --shadow: 0 6px 24px rgba(30,41,59,.08);
  --overlay-bg: rgba(15,23,42,.45);
}

/* اقیانوس */
[data-theme="ocean"] {
  --bg: #0a1929;
  --bg-2: #0f2540;
  --bg-3: #163351;
  --fg: #d8e8f5;
  --fg-muted: #7a9cba;
  --accent: #38bdf8;
  --accent-2: #22d3ee;
  --border: #1e3a5c;
  --shadow: 0 6px 24px rgba(0,0,0,.45);
}

/* بنفشه */
[data-theme="violet"] {
  --bg: #14101f;
  --bg-2: #1d1730;
  --bg-3: #2a2145;
  --fg: #e9e2f5;
  --fg-muted: #9d8cc0;
  --accent: #a78bfa;
  --accent-2: #f472b6;
  --border: #322750;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
}

/* غروب */
[data-theme="sunset"] {
  --bg: #1a0e14;
  --bg-2: #251520;
  --bg-3: #331c2c;
  --fg: #f5e5eb;
  --fg-muted: #b08898;
  --accent: #fb923c;
  --accent-2: #f472b6;
  --border: #3d2232;
  --shadow: 0 6px 24px rgba(0,0,0,.55);
}

/* جنگل */
[data-theme="forest"] {
  --bg: #0d1712;
  --bg-2: #14231b;
  --bg-3: #1c3026;
  --fg: #dff0e5;
  --fg-muted: #7fa38d;
  --accent: #4ade80;
  --accent-2: #86efac;
  --border: #24402f;
  --shadow: 0 6px 24px rgba(0,0,0,.45);
}

/* قهوه */
[data-theme="coffee"] {
  --bg: #1a1410;
  --bg-2: #241c16;
  --bg-3: #32271e;
  --fg: #f0e5d8;
  --fg-muted: #a89684;
  --accent: #d4a373;
  --accent-2: #e9c46a;
  --border: #3d2f24;
  --shadow: 0 6px 24px rgba(0,0,0,.55);
}

/* برفی */
[data-theme="snow"] {
  --bg: #eef2f7;
  --bg-2: #ffffff;
  --bg-3: #e3e9f2;
  --fg: #1e293b;
  --fg-muted: #64748b;
  --accent: #0ea5e9;
  --accent-2: #14b8a6;
  --border: #d4dbe6;
  --shadow: 0 6px 24px rgba(30,41,59,.08);
  --overlay-bg: rgba(15,23,42,.4);
}

/* ============================================================
   پایه
   ============================================================ */
* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Shabnam', system-ui, -apple-system, sans-serif;
  line-height: 1.95;
  font-size: 15px;
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  transition: background-color .3s ease, color .3s ease;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- Top bar ---------- */
.topbar {
  position: fixed;
  top: 0; right: 0; left: 0;
  height: var(--topbar-h);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 100;
  transition: background-color .3s ease, border-color .3s ease;
  padding-top: env(safe-area-inset-top);
  height: calc(var(--topbar-h) + env(safe-area-inset-top));
}

.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 8px;
  width: 40px; height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .2s;
  padding: 0;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg-3); border-color: var(--accent); color: var(--accent); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { display: block; transition: transform .4s ease; }
#settingsBtn:hover svg { transform: rotate(90deg); }

/* دکمه نصب PWA */
#installBtn {
  display: none;
  width: auto;
  padding: 0 12px;
  gap: 6px;
  font-family: inherit;
  font-size: .82rem;
  color: var(--accent-2);
  border-color: color-mix(in srgb, var(--accent-2) 40%, var(--border));
}
#installBtn.visible { display: inline-flex; }
#installBtn:hover { background: var(--bg-3); }

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 1rem;
  flex-shrink: 0;
  color: var(--accent);
}
.brand svg { display: block; }
.brand span { color: var(--fg); }

.topbar-current {
  margin-right: auto;
  font-size: .85rem;
  color: var(--fg-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 55%;
  text-align: left;
  transition: color .2s;
}
.topbar-current.ayah-active {
  color: var(--accent-2);
  font-weight: 500;
}
.topbar-current .tb-sep {
  color: var(--fg-muted);
  opacity: .5;
  margin: 0 6px;
}
.topbar-current .tb-ayah {
  color: var(--accent);
}

/* ---------- Layout ---------- */
.layout { padding-top: var(--topbar-h); min-height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-2);
  border-left: 1px solid var(--border);
  height: calc(100vh - var(--topbar-h));
  overflow: hidden;
  position: fixed;
  top: var(--topbar-h);
  right: 0;
  z-index: 90;
  transition: transform .25s ease, background-color .3s ease, border-color .3s ease;
  display: flex;
  flex-direction: column;
}
.sidebar.hidden { transform: translateX(100%); }

.sidebar-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
  flex-shrink: 0;
}
.sidebar-tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--fg-muted);
  padding: 12px 6px 11px;
  font-family: inherit;
  font-size: .9rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s, background .15s;
}
.sidebar-tab:hover { color: var(--fg); background: var(--bg-3); }
.sidebar-tab.active {
  color: var(--accent-2);
  border-bottom-color: var(--accent-2);
}

.tab-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1;
  overflow: hidden;
}
.tab-panel.hidden { display: none; }

.search { padding: 12px 14px 10px; flex-shrink: 0; }
.search input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--fg);
  font-family: inherit;
  font-size: .9rem;
  outline: none;
  transition: border-color .15s, background-color .3s ease, color .3s ease;
}
.search input:focus { border-color: var(--accent); }

.surah-list,
.ayah-list {
  list-style: none;
  padding: 0 0 20px;
  margin: 0;
  overflow-y: auto;
  flex: 1;
}

.surah-list li a,
.ayah-list li a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: var(--fg);
  text-decoration: none;
  font-size: .93rem;
  border-right: 3px solid transparent;
  transition: background .15s, border-color .15s, color .15s;
  cursor: pointer;
}
.surah-list li a:hover,
.ayah-list li a:hover {
  background: var(--bg-3);
  border-right-color: var(--fg-muted);
}
.surah-list li a.active,
.ayah-list li a.active {
  background: var(--bg-3);
  border-right-color: var(--accent-2);
  color: var(--accent-2);
}

.surah-num {
  min-width: 30px;
  color: var(--fg-muted);
  font-size: .82rem;
  font-variant-numeric: tabular-nums;
}

.ayah-panel-head {
  padding: 12px 20px 6px;
  font-size: .82rem;
  color: var(--fg-muted);
  flex-shrink: 0;
}

.ayah-list .ayah-title-short {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: .9rem;
}

.ayah-list .ayah-num {
  min-width: 26px;
  text-align: left;
  color: var(--fg-muted);
  font-size: .82rem;
  font-variant-numeric: tabular-nums;
}
.ayah-list li a.active .ayah-num { color: var(--accent-2); }

/* ---------- Content ---------- */
.content {
  margin-right: var(--sidebar-w);
  padding: 20px 36px 120px;
  transition: margin-right .25s ease;
}
.content.full { margin-right: 0; }

.ayah {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s, background-color .3s ease;
  scroll-margin-top: calc(var(--topbar-h) + 20px);
}
.ayah:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.ayah.open { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: var(--shadow); }

.ayah-head {
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: background .15s;
}
.ayah-head:hover { background: var(--bg-3); }

.ayah-head-title {
  font-size: calc(1.02rem * var(--reading-scale));
  color: var(--accent-2);
  font-weight: 700;
  margin: 0 0 8px;
  padding-left: 26px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  line-height: 1.7;
}

.ayah-badge, .page-badge {
  font-size: .72rem;
  font-weight: 500;
  padding: 2px 10px;
  border-radius: 20px;
  background: var(--bg-3);
  color: var(--fg-muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.ayah-badge { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

.ayah-preview {
  color: var(--fg-muted);
  font-size: calc(.9rem * var(--reading-scale));
  line-height: 1.9;
  margin: 0;
  text-align: justify;
}
.ayah.open .ayah-preview { display: none; }

.ayah-chevron {
  position: absolute;
  left: 18px;
  top: 20px;
  color: var(--fg-muted);
  transition: transform .3s ease, color .15s;
  display: block;
}
.ayah.open .ayah-chevron { transform: rotate(180deg); color: var(--accent); }

.ayah-body { display: none; }
.ayah.open .ayah-body { display: block; animation: fadeSlide .25s ease; }

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ayah-content {
  padding: 14px 20px 18px;
  border-top: 1px dashed var(--border);
}
.ayah-content p {
  margin: 0 0 12px;
  text-align: justify;
  font-size: calc(1rem * var(--reading-scale));
  color: var(--fg);
  line-height: 2;
}
.ayah-content p:last-child { margin-bottom: 0; }

.state {
  text-align: center;
  padding: 80px 20px;
  color: var(--fg-muted);
}
.spinner {
  width: 42px; height: 42px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #ff8080; }
.error code {
  background: var(--bg-3);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent);
  font-size: .85em;
}

.backdrop {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.backdrop.visible { opacity: 1; pointer-events: auto; }

/* ============================================================
   پنل تنظیمات
   ============================================================ */
.settings-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.settings-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.settings-modal {
  width: 100%;
  max-width: 580px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  transform: scale(.94) translateY(10px);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.2), background-color .3s ease, border-color .3s ease;
}
.settings-overlay.visible .settings-modal {
  transform: scale(1) translateY(0);
}

.settings-header {
  position: sticky;
  top: 0;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 2;
  border-radius: 18px 18px 0 0;
  transition: background-color .3s ease, border-color .3s ease;
}
.settings-header h2 {
  margin: 0;
  font-size: 1.1rem;
  color: var(--fg);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.settings-header h2 svg { color: var(--accent); }
.settings-close {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg-muted);
  width: 34px; height: 34px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  padding: 0;
}
.settings-close:hover {
  background: var(--bg-3);
  color: var(--fg);
  border-color: var(--accent);
}

.settings-body { padding: 20px; }

.settings-section { margin-bottom: 26px; }
.settings-section:last-child { margin-bottom: 4px; }

.settings-section h3 {
  font-size: .85rem;
  color: var(--fg-muted);
  font-weight: 500;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.settings-section h3::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ---------- Theme cards ---------- */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 10px;
}

.theme-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  background: var(--bg-3);
  border: 2px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all .2s ease;
  font-family: inherit;
  color: var(--fg);
  position: relative;
  overflow: hidden;
}
.theme-card:hover {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,.2);
}
.theme-card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}

.theme-preview {
  height: 46px;
  border-radius: 8px;
  background: var(--p-bg);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 8px;
  border: 1px solid rgba(0,0,0,.12);
}
.theme-preview .pv-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--p-accent);
  box-shadow: 0 0 8px var(--p-accent);
}
.theme-preview .pv-dot.alt {
  background: var(--p-accent2);
  box-shadow: 0 0 8px var(--p-accent2);
}
.theme-preview .pv-line {
  height: 3px;
  width: 26px;
  border-radius: 2px;
  background: var(--p-fg);
  opacity: .55;
}
.theme-preview .pv-line.short { width: 14px; }

.theme-name {
  font-size: .78rem;
  font-weight: 500;
  text-align: center;
  color: var(--fg);
  line-height: 1.3;
}

.theme-check {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg-2);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.theme-card.active .theme-check { display: flex; }

/* ---------- Font size ---------- */
.font-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.font-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px 4px 8px;
  background: var(--bg-3);
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
  color: var(--fg);
  transition: all .18s ease;
  min-height: 76px;
}
.font-btn:hover {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
  transform: translateY(-2px);
}
.font-btn.active {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--bg-3));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.font-btn .fa {
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  transition: color .15s;
}
.font-btn.active .fa { color: var(--accent-2); }
.font-btn .lbl {
  font-size: .7rem;
  color: var(--fg-muted);
  white-space: nowrap;
}
.font-btn.active .lbl { color: var(--fg); }

/* ---------- Responsive ---------- */
@media (max-width: 820px) {
  .content { margin-right: 0; padding: 14px 14px 100px; }
  .sidebar {
    width: 82%;
    max-width: 320px;
    box-shadow: -10px 0 30px rgba(0,0,0,.5);
  }
  .topbar-current { font-size: .78rem; max-width: 40%; }
  .ayah-head { padding: 14px 16px; }
  .ayah-content { padding: 12px 16px 16px; }

  .settings-modal { max-height: 92vh; border-radius: 14px; }
  .theme-grid { grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 8px; }
  .font-row { grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .font-btn { min-height: 68px; padding: 8px 2px 6px; }

  .brand span { display: none; }

}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg-muted) 40%, transparent); border-radius: 6px; }

<script>
/* ============================================================
   ۰) تنظیمات (تم + فونت)
   ============================================================ */
const SETTINGS_KEY = 'manavi_settings_v1';
const settings = {
  theme: 'dark',
  scale: 1
};

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
    if (s) {
      if (s.theme) settings.theme = s.theme;
      if (typeof s.scale === 'number' && s.scale > 0) settings.scale = s.scale;
    }
  } catch {}
}

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
}

function applySettings() {
  // تم
  if (settings.theme && settings.theme !== 'dark') {
    document.documentElement.setAttribute('data-theme', settings.theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  // اندازه فونت
  document.documentElement.style.setProperty('--reading-scale', settings.scale);

  // آپدیت theme-color مرورگر بر اساس تم
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0f1115';
    metaTheme.setAttribute('content', bgColor);
  }

  // هایلایت کارت‌ها
  document.querySelectorAll('#themeGrid .theme-card').forEach(c => {
    c.classList.toggle('active', c.dataset.theme === settings.theme);
  });
  document.querySelectorAll('#fontRow .font-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.scale) === settings.scale);
  });
}

/* ---------- اتصال رویدادها ---------- */
function initSettingsUI() {
  const overlay = document.getElementById('settingsOverlay');

  // باز/بسته
  document.getElementById('settingsBtn').addEventListener('click', () => {
    overlay.classList.add('visible');
  });
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSettings();
  });

  // کلیک روی کارت تم
  document.querySelectorAll('#themeGrid .theme-card').forEach(card => {
    card.addEventListener('click', () => {
      settings.theme = card.dataset.theme;
      applySettings();
      saveSettings();
    });
  });

  // کلیک روی دکمه فونت
  document.querySelectorAll('#fontRow .font-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.scale = Number(btn.dataset.scale);
      applySettings();
      saveSettings();
    });
  });
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('visible');
}

/* ============================================================
   ۱) وضعیت‌ها
   ============================================================ */
let DB = null;
let currentSurahNum = null;
let currentAyahIdx = -1;
let activeTab = 'surahs';
const STATE_KEY = 'manavi_state_v2';
let saveTimer = null;

/* ============================================================
   ۲) ابزارها
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function ayahRangeLabel(a) {
  if (!a.ayah_numbers || !a.ayah_numbers.length) return '؟';
  if (a.ayah_min === a.ayah_max) return a.ayah_min;
  return `${a.ayah_min}–${a.ayah_max}`;
}

function firstAyahNumber(a) {
  if (a.ayah_numbers && a.ayah_numbers.length) return a.ayah_numbers[0];
  return '؟';
}

function preview(content, maxWords = 25) {
  const text = (content || []).join(' ').replace(/\s+/g, ' ').trim();
  if (!text) return '';
  const words = text.split(' ');
  if (words.length <= maxWords) return text;
  return words.slice(0, maxWords).join(' ') + ' …';
}

function shortTitle(t, maxWords = 5) {
  const text = String(t || '').trim();
  if (!text) return '';
  const words = text.split(/\s+/);
  if (words.length <= maxWords) return text;
  return words.slice(0, maxWords).join(' ') + '…';
}

/* ============================================================
   ۳) به‌روزرسانی هدر
   ============================================================ */
function updateTopbar() {
  const el = document.getElementById('currentSurahLabel');
  if (!DB || currentSurahNum == null) {
    el.textContent = '';
    el.classList.remove('ayah-active');
    return;
  }
  const surah = DB.surahs.find(s => s.number === currentSurahNum);
  if (!surah) return;

  if (currentAyahIdx >= 0 && surah.ayahs[currentAyahIdx]) {
    const a = surah.ayahs[currentAyahIdx];
    const num = ayahRangeLabel(a);
    const title = shortTitle(a.clean_title || a.title, 8);
    el.innerHTML =
      `<span>سورهٔ ${escapeHtml(surah.name)}</span>` +
      `<span class="tb-sep">•</span>` +
      `<span class="tb-ayah">آیهٔ ${escapeHtml(String(num))}</span>` +
      (title ? `<span class="tb-sep">—</span><span>${escapeHtml(title)}</span>` : '');
    el.classList.add('ayah-active');
  } else {
    el.innerHTML =
      `<span>سورهٔ ${escapeHtml(surah.name)}</span>` +
      `<span class="tb-sep">•</span>` +
      `<span>${surah.ayahs.length} آیه</span>`;
    el.classList.remove('ayah-active');
  }
}

/* ============================================================
   ۴) ذخیره/بازیابی state
   ============================================================ */
function saveState(immediate = false) {
  const state = {
    surah: currentSurahNum,
    ayahIndex: currentAyahIdx,
    scroll: window.scrollY,
    tab: activeTab,
    ts: Date.now()
  };
  const doSave = () => {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch {}
  };
  if (immediate) doSave();
  else { clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 150); }
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (s && s.surah) return s;
  } catch {}
  return null;
}

/* ============================================================
   ۵) بارگذاری JSON
   ============================================================ */
fetch('manavi_surahs.json')
  .then(r => {
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.json();
  })
  .then(json => {
    DB = json;
    renderSidebar(DB.surahs);

    const st = loadState();
    const startNum = (st && st.surah) || (DB.surahs[0] && DB.surahs[0].number);
    const startIdx = st ? st.ayahIndex : -1;
    const savedScroll = st ? st.scroll : 0;
    const startTab = st && st.tab ? st.tab : 'surahs';

    switchTab(startTab, false);
    if (window.innerWidth > 820) openSidebar();
    selectSurah(startNum, { openAyahIndex: startIdx, savedScroll });
  })
  .catch(err => {
    const isOffline = !navigator.onLine;
    document.getElementById('content').innerHTML =
      `<div class="state error">
         <p>${isOffline ? '📡 اتصال اینترنت قطع است' : 'خطا در بارگذاری <code>manavi_surahs.json</code>'}</p>
         <p style="font-size:.85rem">${escapeHtml(err.message)}</p>
         <p style="font-size:.85rem">اگر اولین بار است اجرا می‌کنید، یک سرور محلی راه‌اندازی کنید: <code>python -m http.server 8000</code></p>
       </div>`;
  });

/* ============================================================
   ۶) سایدبار
   ============================================================ */
const sidebarEl  = document.getElementById('sidebar');
const contentEl  = document.getElementById('content');
const backdropEl = document.getElementById('backdrop');

function openSidebar() {
  sidebarEl.classList.remove('hidden');
  contentEl.classList.remove('full');
  if (window.innerWidth <= 820) backdropEl.classList.add('visible');
}
function closeSidebar() {
  sidebarEl.classList.add('hidden');
  contentEl.classList.add('full');
  backdropEl.classList.remove('visible');
}
function toggleSidebar() {
  if (sidebarEl.classList.contains('hidden')) openSidebar();
  else closeSidebar();
}

document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
backdropEl.addEventListener('click', closeSidebar);

/* ============================================================
   ۷) تب‌ها
   ============================================================ */
function switchTab(name, save = true) {
  activeTab = name;
  document.querySelectorAll('.sidebar-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.getElementById('panel-surahs').classList.toggle('hidden', name !== 'surahs');
  document.getElementById('panel-ayahs').classList.toggle('hidden', name !== 'ayahs');
  if (save) saveState(true);
}

document.querySelectorAll('.sidebar-tab').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

/* ============================================================
   ۸) لیست سوره‌ها
   ============================================================ */
function renderSidebar(surahs, filter = '') {
  const listEl = document.getElementById('surahList');
  const q = filter.trim().toLowerCase();
  const filtered = !q ? surahs : surahs.filter(s =>
    s.name.toLowerCase().includes(q) || String(s.number).includes(q)
  );
  listEl.innerHTML = filtered.map(s => `
    <li>
      <a data-num="${s.number}">
        <span class="surah-num">${s.number}.</span>
        <span>${escapeHtml(s.name)}</span>
      </a>
    </li>
  `).join('');

  listEl.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      selectSurah(Number(a.dataset.num));
      if (window.innerWidth <= 820) closeSidebar();
    });
  });
  highlightActiveSurah();
}

function highlightActiveSurah() {
  document.querySelectorAll('#surahList a').forEach(a => {
    a.classList.toggle('active', Number(a.dataset.num) === currentSurahNum);
  });
}

/* ============================================================
   ۹) لیست آیات
   ============================================================ */
function renderAyahPanel(surah) {
  const listEl = document.getElementById('ayahList');
  const headEl = document.getElementById('ayahPanelHead');

  if (!surah) {
    headEl.textContent = 'آیه‌ای نمایش داده نشده';
    listEl.innerHTML = '';
    return;
  }

  headEl.textContent = `سورهٔ ${surah.name} — ${surah.ayahs.length} آیه`;

  listEl.innerHTML = surah.ayahs.map((a, i) => {
    const num = firstAyahNumber(a);
    const title = shortTitle(a.clean_title || a.title, 5);
    return `
      <li>
        <a data-idx="${i}">
          <span class="ayah-title-short">${escapeHtml(title)}</span>
          <span class="ayah-num">${num}</span>
        </a>
      </li>
    `;
  }).join('');

  listEl.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      const idx = Number(a.dataset.idx);
      const ayahEl = document.querySelector(`.ayah[data-idx="${idx}"]`);
      if (ayahEl) {
        openAyah(ayahEl);
        if (window.innerWidth <= 820) closeSidebar();
      }
    });
  });

  highlightActiveChip();
}

function highlightActiveChip() {
  document.querySelectorAll('#ayahList a').forEach(a => {
    a.classList.toggle('active', Number(a.dataset.idx) === currentAyahIdx);
  });
}

/* ============================================================
   ۱۰) رندر سوره
   ============================================================ */
function selectSurah(num, opts = {}) {
  if (!DB) return;
  const surah = DB.surahs.find(s => s.number === num);
  if (!surah) return;

  currentSurahNum = num;
  currentAyahIdx = -1;
  highlightActiveSurah();

  contentEl.innerHTML = surah.ayahs.map((a, i) => `
    <article class="ayah" data-idx="${i}">
      <div class="ayah-head" data-toggle>
        <div class="ayah-head-title">
          <span>${escapeHtml(a.clean_title || a.title)}</span>
          <span class="ayah-badge">آیهٔ ${ayahRangeLabel(a)}</span>
        </div>
        <p class="ayah-preview">${escapeHtml(preview(a.content, 25))}</p>
        <svg class="ayah-chevron" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      <div class="ayah-body">
        <div class="ayah-content">
          ${(a.content || []).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
        </div>
      </div>
    </article>
  `).join('');

  contentEl.querySelectorAll('.ayah-head').forEach(head => {
    head.addEventListener('click', () => toggleAyah(head.parentElement));
  });

  renderAyahPanel(surah);
  updateTopbar();

  const openIdx = opts.openAyahIndex;
  if (typeof openIdx === 'number' && openIdx >= 0) {
    const target = contentEl.querySelector(`.ayah[data-idx="${openIdx}"]`);
    if (target) {
      openAyah(target, false);
      requestAnimationFrame(() => {
        if (opts.savedScroll && opts.savedScroll > 0) {
          window.scrollTo({ top: opts.savedScroll, behavior: 'auto' });
        } else {
          target.scrollIntoView({ behavior: 'auto', block: 'start' });
        }
      });
    }
  } else {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  saveState(true);
}

/* ============================================================
   ۱۱) آکاردئون
   ============================================================ */
function closeAllAyahs() {
  document.querySelectorAll('.ayah.open').forEach(a => a.classList.remove('open'));
}

function openAyah(ayahEl, scroll = true) {
  closeAllAyahs();
  ayahEl.classList.add('open');
  currentAyahIdx = Number(ayahEl.dataset.idx);
  highlightActiveChip();
  updateTopbar();
  if (scroll) {
    setTimeout(() => ayahEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  }
  saveState(true);
}

function toggleAyah(ayahEl) {
  if (ayahEl.classList.contains('open')) {
    ayahEl.classList.remove('open');
    currentAyahIdx = -1;
    highlightActiveChip();
    updateTopbar();
    saveState(true);
  } else {
    openAyah(ayahEl);
  }
}

/* ============================================================
   ۱۲) جستجو
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', e => {
  if (!DB) return;
  renderSidebar(DB.surahs, e.target.value);
});

/* ============================================================
   ۱۳) ذخیره در اسکرول/خروج
   ============================================================ */
let scrollTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => saveState(true), 400);
}, { passive: true });

window.addEventListener('beforeunload', () => saveState(true));

/* ============================================================
   ۱۴) کلید Esc
   ============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    // اگر پنل تنظیمات بازه، اول اون رو ببند
    const overlay = document.getElementById('settingsOverlay');
    if (overlay.classList.contains('visible')) {
      closeSettings();
      return;
    }
    const open = document.querySelector('.ayah.open');
    if (open) {
      open.classList.remove('open');
      currentAyahIdx = -1;
      highlightActiveChip();
      updateTopbar();
      saveState(true);
    } else if (window.innerWidth <= 820) closeSidebar();
  }
});

/* ============================================================
   ۱۵) راه‌اندازی تنظیمات
   ============================================================ */
loadSettings();
applySettings();
initSettingsUI();

/* ============================================================
   ۱۶) PWA — ثبت Service Worker
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        console.log('[PWA] Service Worker registered:', reg.scope);

        // بررسی آپدیت
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[PWA] نسخه جدید موجود است. رفرش کنید.');
              // می‌توانید نوتیفیکیشن کوچکی نمایش دهید
            }
          });
        });
      })
      .catch(err => console.warn('[PWA] SW registration failed:', err));
  });
}

/* ============================================================
   ۱۷) PWA — دکمه نصب
   ============================================================ */
let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add('visible');
  console.log('[PWA] آماده نصب');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('[PWA] نتیجه نصب:', outcome);
  deferredPrompt = null;
  installBtn.classList.remove('visible');
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] اپلیکیشن نصب شد');
  deferredPrompt = null;
  installBtn.classList.remove('visible');
});

/* ============================================================
   ۱۸) PWA — نمایش وضعیت آفلاین
   ============================================================ */
const offlineBanner = document.getElementById('offlineBanner');

function updateOnlineStatus() {
  if (navigator.onLine) {
    offlineBanner.classList.remove('visible');
  } else {
    offlineBanner.classList.add('visible');
  }
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
</script>
